[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcsel-sim"
version = "0.1.0"
description = "1D transfer-matrix VCSEL design tool (threshold gain, standing-wave field, mirror reflectance) with a browser GUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["vcsel_sim"]
